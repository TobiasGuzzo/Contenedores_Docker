services:
  mariadb-practica:
    image: mariadb:latest
    container_name: mariadb-practica
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: Matujack99
      MARIADB_DATABASE: db1
      MARIADB_USER: mi_usuario
      MARIADB_PASSWORD: Tobi99
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
    driver: local
